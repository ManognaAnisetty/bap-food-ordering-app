<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>My orders — BAP</title><link rel="stylesheet" href="assets/styles.css"></head><body><main id="app"></main><script src="assets/app.js"></script><script>
const previous=[{d:'12 Sep 2026',n:'Olive & Hearth',x:'Truffle mushroom pasta · Garlic bread',p:'₹812',s:'Delivered',i:'https://images.unsplash.com/photo-1621996346565-e3dbc646d9a9?auto=format&fit=crop&w=500&q=85'},{d:'08 Sep 2026',n:'Nori House',x:'Veg ramen · Edamame · Matcha tea',p:'₹945',s:'Delivered',i:'https://images.unsplash.com/photo-1569718212165-3a8278d5f624?auto=format&fit=crop&w=500&q=85'}],orders=[...getOrders(),...previous];mount(`<section class="orders"><div class="container"><span class="eyebrow">Your food story</span><h1>Orders, <i>remembered.</i></h1><p class="muted" style="margin-top:-15px;margin-bottom:32px">The best meals are worth revisiting. Here’s where you’ve been lately.</p>${orders.map(o=>`<article class="order-card"><img src="${o.i}" alt="${o.n}"><div><span class="eyebrow" style="font-size:.62rem">${o.d}</span><h3 style="font-size:1.3rem;margin:5px 0">${o.n}</h3><p class="muted" style="font-size:.8rem;margin:0">${o.x}</p></div><div style="text-align:right"><b>${o.p}</b><p><span class="status">${o.s}</span></p><a href="menu.html" style="color:var(--red);font-size:.8rem;font-weight:700">Order again →</a></div></article>`).join('')}</div></section>`);
</script></body></html>
