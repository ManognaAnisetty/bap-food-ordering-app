<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Your cart — BAP</title><link rel="stylesheet" href="assets/styles.css"></head><body><main id="app"></main><script src="assets/app.js"></script><script>
function renderCart(){let cart=getCart(),entries=Object.entries(cart).filter(([,q])=>q>0),itemTotal=entries.reduce((s,[i,q])=>s+dishes[i].price*q,0),fees=entries.length?36:0,total=itemTotal+fees;mount(`<section class="container cart-layout"><div><span class="eyebrow">Almost there</span><h1>Your order</h1><div class="cart-items">${entries.length?`<div class="meta" style="padding-bottom:12px"><span>Saffron Table</span><span>·</span><span>28–35 min</span></div>${entries.map(([i,q])=>{let d=dishes[i];return `<div class="cart-row"><img src="${d.img}" alt="${d.name}"><div><h3>${d.name}</h3><div class="meta"><span>₹${d.price}</span><span>${d.category}</span></div></div><div class="row-end"><b>₹${d.price*q}</b><div class="add-stepper" style="margin-top:8px"><button class="minus" data-i="${i}">−</button><b>${q}</b><button class="plus" data-i="${i}">+</button></div></div></div>`}).join('')}<p class="muted" style="font-size:.85rem">Cutlery will not be added unless requested.</p>`:`<div style="padding:32px 0;text-align:center"><h2>Your cart is empty.</h2><p class="muted">Pick something irresistible from the menu.</p><a class="btn btn-red" href="menu.html">Browse the menu</a></div>`}</div></div><aside class="summary"><h2>Bill details</h2><div class="summary-line"><span>Item total</span><span>₹${itemTotal}</span></div><div class="summary-line"><span>Delivery & platform fee</span><span>₹${fees}</span></div><div class="summary-line summary-total"><span>To pay</span><span>₹${total}</span></div>${entries.length?`<a class="btn btn-red" href="payment.html" style="width:100%;margin-top:22px">Continue to payment →</a>`:`<a class="btn btn-outline" href="menu.html" style="width:100%;margin-top:22px">Add a dish first</a>`}<p class="muted" style="font-size:.75rem;text-align:center">Safe and secure checkout</p></aside></section>`);document.querySelectorAll('.plus').forEach(b=>b.onclick=()=>{changeItem(+b.dataset.i,1);renderCart()});document.querySelectorAll('.minus').forEach(b=>b.onclick=()=>{changeItem(+b.dataset.i,-1);renderCart()});updateCart()}renderCart();
</script></body></html>
