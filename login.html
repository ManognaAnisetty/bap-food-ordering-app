<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Welcome back — BAP</title><link rel="stylesheet" href="assets/styles.css"></head><body><main id="app"></main><script src="assets/app.js"></script><script>
mount(`<section class="auth login-page"><div class="auth-visual food-3d"><div class="auth-message"><span class="eyebrow" style="color:#ffccd4">Dinner, made easy</span><h1>Find something<br><i>delicious tonight.</i></h1><p>Your favourites, addresses and orders are ready when you return.</p></div></div><div class="auth-form"><form class="form-box" id="loginForm"><span class="eyebrow">Welcome back</span><h1>Good to see you.</h1><p class="muted">Use the email and password from your existing account.</p><label>Email address</label><input id="email" type="email" autocomplete="email" required><label>Password</label><input id="password" type="password" autocomplete="current-password" required><p id="formMessage" class="form-message" role="alert"></p><button class="btn btn-red" type="submit">Sign in →</button><p class="muted" style="text-align:center;font-size:.85rem">New to BAP? <a href="signup.html" style="color:var(--red);font-weight:700">Create an account</a></p></form></div></section>`,'auth');document.getElementById('loginForm').addEventListener('submit',e=>{e.preventDefault();let result=signIn(email.value,password.value);if(result.ok)location.href='restaurant.html';else document.getElementById('formMessage').textContent=result.message});
</script></body></html>
