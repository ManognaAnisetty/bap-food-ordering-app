<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Welcome back — BAP</title><link rel="stylesheet" href="assets/styles.css"></head><body><main id="app"></main><script src="assets/app.js"></script><script>
mount(`<section class="auth login-page"><div class="auth-visual food-3d"><div class="food-orbit"><img class="food-float food-one" src="https://images.unsplash.com/photo-1567188040759-fb8a883dc6d8?auto=format&fit=crop&w=700&q=85" alt="Tandoori paneer"><img class="food-float food-two" src="https://images.unsplash.com/photo-1642821373181-696a54913e93?auto=format&fit=crop&w=700&q=85" alt="Vegetable biryani"></div><div class="auth-message"><span class="eyebrow" style="color:#ffccd4">Dinner, made easy</span><h1>Find something<br><i>delicious tonight.</i></h1><p>Thoughtful food from kitchens you will want to revisit.</p></div></div><div class="auth-form"><form class="form-box" id="loginForm"><span class="eyebrow">Welcome back</span><h1>Good to see you.</h1><p class="muted">Sign in and let’s find something lovely.</p><label>Email address</label><input id="email" type="email" placeholder="demo@bap.com" required><label>Password</label><input id="password" type="password" placeholder="••••••••" required><p id="message" style="color:var(--red);font-size:.8rem"></p><button class="btn btn-red" type="submit">Sign in →</button><p class="muted" style="text-align:center;font-size:.85rem">New to BAP? <a href="signup.html" style="color:var(--red);font-weight:700">Create an account</a></p></form></div></section>`,'auth');document.getElementById('loginForm').addEventListener('submit',e=>{e.preventDefault();let user=findUser(email.value);if(!user){message.textContent='No account found. Please create one first.';return}if(user.password&&user.password!==password.value){message.textContent='Incorrect password.';return}setUser(user);location.href='restaurant.html'});
</script></body></html>
