<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Payment — BAP</title><link rel="stylesheet" href="assets/styles.css"></head><body><main id="app"></main><script src="assets/app.js"></script><script>
let entries=Object.entries(getCart()).filter(([,q])=>q>0),items=entries.reduce((s,[i,q])=>s+dishes[i].price*q,0),total=items+(entries.length?36:0);mount(`<section class="container cart-layout"><div><span class="eyebrow">One final step</span><h1>How would you<br><i>like to pay?</i></h1><div class="cart-items"><label class="payment-method"><input type="radio" name="pay" checked><span><b>UPI</b><br><small class="muted">Google Pay, PhonePe, Paytm & more</small></span></label><label class="payment-method"><input type="radio" name="pay"><span><b>Credit or debit card</b><br><small class="muted">Visa, Mastercard, RuPay</small></span></label><label class="payment-method"><input type="radio" name="pay"><span><b>Cash on delivery</b><br><small class="muted">Pay once your order arrives</small></span></label></div></div><aside class="summary"><h2>Order summary</h2><div class="summary-line"><span>${entries.length} item${entries.length===1?'':'s'} in your cart</span><span>₹${items}</span></div><div class="summary-line"><span>Delivery & fees</span><span>₹${entries.length?36:0}</span></div><div class="summary-line summary-total"><span>Total</span><span>₹${total}</span></div><button id="placeOrder" class="btn btn-red" style="width:100%;margin-top:22px" ${entries.length?'':'disabled'}>Place order · ₹${total}</button></aside></section>`);document.getElementById('placeOrder').onclick=()=>{if(placeOrder()){document.getElementById('placeOrder').textContent='Order placed! ✓';setTimeout(()=>location.href='orders.html',500)}else location.href='cart.html';};
</script></body></html>
