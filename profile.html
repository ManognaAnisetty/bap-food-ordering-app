<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>My profile — BAP</title><link rel="stylesheet" href="assets/styles.css"></head><body><main id="app"></main><script src="assets/app.js"></script><script>
let user=getUser();if(!user)location.href='login.html';else{let addresses=user.addresses||[];mount(`<section class="container" style="padding:55px 0"><span class="eyebrow">My account</span><h1>Profile</h1><div class="cart-layout"><div class="cart-items"><h2>Your details</h2><label>Name</label><input id="name" value="${user.name||''}" style="width:100%;padding:12px"><label>Phone number</label><input id="phone" value="${user.phone||''}" style="width:100%;padding:12px"><button id="save" class="btn btn-red" style="margin-top:18px">Save details</button><hr style="margin:28px 0;border:0;border-top:1px solid var(--line)"><div style="display:flex;justify-content:space-between;align-items:center"><h2>Delivery addresses</h2><button id="add" class="btn btn-outline">Add new address</button></div><div id="addressForm" hidden><label>Address name</label><input id="label" placeholder="Home, Work…" style="width:100%;padding:12px"><label>Full address</label><div style="display:flex;gap:8px"><input id="address" placeholder="Building, street, area" style="flex:1;padding:12px"><button id="locate" class="btn btn-outline" title="Use current location">⌖</button></div><small id="locMessage" class="muted"></small><button id="saveAddress" class="btn btn-red" style="margin-top:12px">Save address</button></div><div style="margin-top:16px">${addresses.length?addresses.map(a=>`<label class="payment-method"><input type="radio" name="delivery" value="${a.id}" ${a.id===user.selectedAddressId?'checked':''}><span><b>${a.label}</b><br><small class="muted">${a.address}</small></span></label>`).join(''):'<p class="muted">Add an address and choose where your food should be delivered.</p>'}</div></div></div></section>`,'profile');save.onclick=()=>{updateProfile({name:name.value.trim(),phone:phone.value.trim()});location.reload()};add.onclick=()=>addressForm.hidden=false;saveAddress.onclick=()=>{if(!label.value||!address.value){locMessage.textContent='Please complete the address.';return}let item={id:Date.now().toString(),label:label.value,address:address.value};updateProfile({addresses:[...addresses,item],selectedAddressId:item.id});location.reload()};document.querySelectorAll('[name=delivery]').forEach(x=>x.onchange=()=>updateProfile({selectedAddressId:x.value}));locate.onclick=()=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{address.value=`Current location: ${p.coords.latitude.toFixed(5)}, ${p.coords.longitude.toFixed(5)}`;locMessage.textContent='Location added. You can add a landmark if needed.'},()=>locMessage.textContent='Unable to get location. Please check browser permission.'):locMessage.textContent='Location is unavailable in this browser.'}
</script></body></html>
