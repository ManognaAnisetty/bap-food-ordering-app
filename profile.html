<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>My profile — BAP</title><link rel="stylesheet" href="assets/styles.css"></head><body><main id="app"></main><script src="assets/app.js"></script><script>
function profilePage(){let user=getUser();if(!user){location.href='login.html';return}let addresses=user.addresses||[],favorites=(user.favorites||[]).map(i=>dishes[i]).filter(Boolean);mount(`<section class="profile-page container"><div class="section-head"><div><span class="eyebrow">My account</span><h1>Profile & <i>delivery.</i></h1></div><a class="btn btn-outline" href="restaurant.html">Find food</a></div><div class="profile-grid"><section class="profile-card"><h2>Your details</h2><form id="detailsForm"><label>Name</label><input id="profileName" value="${user.name||''}" required><label>Phone number</label><input id="profilePhone" type="tel" value="${user.phone||''}" required><label>Email address</label><input value="${user.email}" disabled><button class="btn btn-red" type="submit">Save details</button></form></section><section class="profile-card"><div class="card-heading"><div><span class="eyebrow">Deliver to</span><h2>Your addresses</h2></div><button class="btn btn-outline" id="showAddress" type="button">Add new address</button></div><div id="addressForm" class="address-form" hidden><label>Address label</label><input id="addressLabel" placeholder="Home, Work, Hotel…"><label>Full address</label><div class="location-input"><input id="addressDetails" placeholder="House / building, street, area"><button id="useLocation" type="button" title="Use current location">⌖</button></div><small id="locationStatus" class="muted">Use the location button to fill your current coordinates.</small><div class="address-actions"><button class="btn btn-outline" id="cancelAddress" type="button">Cancel</button><button class="btn btn-red" id="saveAddress" type="button">Save address</button></div></div><div class="address-list">${addresses.length?addresses.map(a=>`<label class="address-card ${a.id===user.selectedAddressId?'selected':''}"><input type="radio" name="deliveryAddress" value="${a.id}" ${a.id===user.selectedAddressId?'checked':''}><span><b>${a.label}</b><small>${a.details}</small></span><em>${a.id===user.selectedAddressId?'Deliver here':''}</em></label>`).join(''):`<p class="muted empty-state">Add an address so you can choose exactly where each order is delivered.</p>`}</div></section></div><section class="profile-card favorites-section"><div class="card-heading"><div><span class="eyebrow">Saved for later</span><h2>Favourite items</h2></div><a href="popular.html" class="btn btn-outline">Browse food</a></div><div class="favorite-list">${favorites.length?favorites.map(d=>`<article><img src="${d.img}" alt="${d.name}"><span><b>${d.name}</b><small>${d.restaurant} · ₹${d.price}</small></span><a class="btn btn-outline" href="popular.html">Order</a></article>`).join(''):`<p class="muted empty-state">Tap the heart on any dish to save it here.</p>`}</div></section></section>`,'profile');document.getElementById('detailsForm').onsubmit=e=>{e.preventDefault();updateProfile({name:profileName.value.trim(),phone:profilePhone.value.trim()});location.reload()};document.getElementById('showAddress').onclick=()=>addressForm.hidden=false;document.getElementById('cancelAddress').onclick=()=>addressForm.hidden=true;document.getElementById('saveAddress').onclick=()=>{if(!addressLabel.value.trim()||!addressDetails.value.trim())return locationStatus.textContent='Please add a label and full address.';let next={id:Date.now().toString(),label:addressLabel.value.trim(),details:addressDetails.value.trim()},all=[...addresses,next];updateProfile({addresses:all,selectedAddressId:next.id});location.reload()};document.querySelectorAll('[name=deliveryAddress]').forEach(input=>input.onchange=()=>{updateProfile({selectedAddressId:input.value});location.reload()});document.getElementById('useLocation').onclick=()=>{if(!navigator.geolocation){locationStatus.textContent='Location is not available in this browser.';return}locationStatus.textContent='Getting your current location…';navigator.geolocation.getCurrentPosition(p=>{addressDetails.value=`Current location: ${p.coords.latitude.toFixed(5)}, ${p.coords.longitude.toFixed(5)}`;locationStatus.textContent='Current location added. You can add a building or landmark too.'},()=>locationStatus.textContent='We could not access your location. Check browser permission and try again.')};}profilePage();
</script></body></html>
