<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>My profile — BAP</title><link rel="stylesheet" href="assets/styles.css"></head><body><main id="app"></main><script src="assets/app.js"></script><script>
let user=getUser();if(!user)location.href='login.html';else{let addresses=user.addresses||[];mount(`<section class="profile-hero"><div class="container"><span class="eyebrow">Your account</span><h1>Hello, ${user.name||'food lover'}.</h1><p class="muted">Keep your details and delivery addresses ready for a smoother next order.</p></div></section><section class="container profile-layout"><aside class="profile-sidebar"><div class="profile-mark">${(user.name||'B').slice(0,1).toUpperCase()}</div><h2>${user.name||'BAP member'}</h2><p>${user.email}</p><span>Personal details</span><span>Saved addresses</span></aside><div class="profile-content"><section class="profile-panel"><div class="profile-panel-heading"><div><span class="eyebrow">Personal details</span><h2>About you</h2></div><p>Used for your orders and delivery updates.</p></div><div class="form-grid"><label>Your name<input id="name" value="${user.name||''}"></label><label>Phone number<input id="phone" type="tel" value="${user.phone||''}" placeholder="Add your phone number"></label><label class="email-field">Email address<input value="${user.email}" disabled></label></div><button id="save" class="btn btn-red">Save changes</button></section><section class="profile-panel"><div class="profile-panel-heading address-heading"><div><span class="eyebrow">Where should we deliver?</span><h2>Saved addresses</h2></div><button id="add" class="btn btn-outline">+ Add new address</button></div><div id="addressForm" class="address-editor" hidden><div class="form-grid"><label>Address label<input id="label" placeholder="Home, Work, Hotel…"></label><label class="address-field">Complete address <div class="location-row"><input id="address" placeholder="Building, street, area"><button id="locate" type="button" aria-label="Use current location" title="Use current location">⌖</button></div></label></div><small id="locMessage" class="muted">Tap the location icon to use your current location.</small><div class="editor-actions"><button id="cancel" class="btn btn-outline" type="button">Cancel</button><button id="saveAddress" class="btn btn-red" type="button">Save address</button></div></div><div class="address-stack">${addresses.length?addresses.map(a=>`<label class="address-option ${a.id===user.selectedAddressId?'selected':''}"><input type="radio" name="delivery" value="${a.id}" ${a.id===user.selectedAddressId?'checked':''}><span class="address-icon">⌂</span><span><b>${a.label}</b><small>${a.address}</small></span><em>${a.id===user.selectedAddressId?'Deliver here':'Choose'}</em></label>`).join(''):`<div class="empty-address"><span>⌂</span><div><b>No address saved yet.</b><p>Add your home, workplace, or any delivery location.</p></div></div>`}</div></section></div></section>`,'profile');save.onclick=()=>{updateProfile({name:name.value.trim(),phone:phone.value.trim()});location.reload()};add.onclick=()=>addressForm.hidden=false;cancel.onclick=()=>addressForm.hidden=true;saveAddress.onclick=()=>{if(!label.value.trim()||!address.value.trim()){locMessage.textContent='Please enter both an address label and the full address.';return}let item={id:Date.now().toString(),label:label.value.trim(),address:address.value.trim()};updateProfile({addresses:[...addresses,item],selectedAddressId:item.id});location.reload()};document.querySelectorAll('[name=delivery]').forEach(x=>x.onchange=()=>{updateProfile({selectedAddressId:x.value});location.reload()});locate.onclick=()=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{address.value=`Current location: ${p.coords.latitude.toFixed(5)}, ${p.coords.longitude.toFixed(5)}`;locMessage.textContent='Current location added. Add a landmark if helpful.'},()=>locMessage.textContent='Unable to get location. Check your browser location permission and try again.'):locMessage.textContent='Location is unavailable in this browser.'}
</script></body></html>
