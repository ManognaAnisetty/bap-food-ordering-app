<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Saffron Table — BAP</title><link rel="stylesheet" href="assets/styles.css"></head><body><main id="app"></main><script src="assets/app.js"></script><script>
const mainDishes=dishes.slice(0,5);let active=0;function renderHero(){let d=mainDishes[active],i=dishes.indexOf(d),qty=getCart()[i]||0,displayPrice=qty?d.price*qty:d.price;document.querySelector('.dish-copy').innerHTML=`<span class="eyebrow">Chef's signature · ${String(active+1).padStart(2,'0')}</span><h1 class="dish-name">${d.name}</h1><div class="meta"><span class="rating">★ ${d.rating}</span><span>${d.reviews} reviews</span><span>● Vegetarian</span></div><p class="muted">${d.desc}</p><div class="price">₹${displayPrice}</div><div class="quantity"><button id="minus" aria-label="Remove one ${d.name}">−</button><b>${qty}</b><button id="plus" aria-label="Add one ${d.name}">+</button><span class="muted">serving${qty===1?'':'s'}</span></div><button class="btn btn-red" id="heroAdd" style="min-width:180px">Add to order · ₹${d.price}</button>`;document.querySelector('.plate').innerHTML=`<img src="${d.img}" alt="${d.name}">`;document.querySelectorAll('.thumb').forEach((t,i)=>t.classList.toggle('current',i===active));document.querySelectorAll('.side-chip').forEach((c,i)=>{let delta=i-active;c.style.transform=`translateY(${delta*64}px) scale(${i===active?1:.78})`;c.style.opacity=Math.abs(delta)>2?0:.35});const changeHeroQuantity=amount=>{changeItem(i,amount);refreshMenuActions();renderHero()};document.querySelector('#minus').onclick=()=>changeHeroQuantity(-1);document.querySelector('#plus').onclick=()=>changeHeroQuantity(1);document.querySelector('#heroAdd').onclick=()=>changeHeroQuantity(1);bindAdds()}
mount(`<section class="menu-hero"><div class="container restaurant-intro"><a class="icon-btn" href="restaurant.html">←</a><img class="rest-image" src="https://images.unsplash.com/photo-1585937421612-70a008356fbe?auto=format&fit=crop&w=300&q=85" alt="Saffron Table"><div><h1>Saffron Table</h1><div class="meta"><span class="rating">★ 4.8 (2.6k)</span><span>North Indian · Mughlai</span><span>₹₹</span></div></div></div></section><section class="menu-track" id="dishTrack"><div class="sticky-dish"><div class="dish-copy"></div><div class="dish-stage"><div class="orb"></div><div class="plate"></div><div class="thumbs">${mainDishes.map((_,i)=>`<button class="thumb ${i===0?'current':''}" data-i="${i}" aria-label="Dish ${i+1}"></button>`).join('')}</div>${mainDishes.map((d,i)=>`<div class="side-chip" style="top:50%"><img src="${d.img}" alt=""><span>${d.name}</span></div>`).join('')}</div></div></section><section class="special"><span class="eyebrow" style="color:#ffd8de">Seasonal kitchen notes</span><h2>Chef’s specials this week.</h2><p>A short, flavour-filled detour from the usual menu — made in limited batches every evening.</p><a href="#fullmenu" class="btn" style="background:#fff;color:var(--red)">View full menu</a> <a href="#footer" class="btn btn-outline">Ask about ingredients</a></section><section class="full-menu" id="fullmenu"><div class="container"><div class="section-head"><div><span class="eyebrow">Stay a while</span><h2>Full menu</h2></div><p class="muted">Every plate is made after you order, with ingredients we’d proudly serve at our own table.</p></div><div class="filters"><button class="filter active" data-filter="All">All dishes</button>${['Starters','Mains','Desserts','Drinks'].map(x=>`<button class="filter" data-filter="${x}">${x}</button>`).join('')}</div><div class="dish-grid">${dishes.map(menuCard).join('')}</div></div></section>`,'menu');renderHero();
document.querySelectorAll('.thumb').forEach(t=>t.onclick=()=>{document.getElementById('dishTrack').scrollIntoView({behavior:'smooth'});window.scrollTo({top:document.getElementById('dishTrack').offsetTop+Number(t.dataset.i)*window.innerHeight*.82,behavior:'smooth'})});let ticking=false;addEventListener('scroll',()=>{if(ticking)return;ticking=true;requestAnimationFrame(()=>{let el=document.getElementById('dishTrack'),p=Math.max(0,Math.min(1,-el.getBoundingClientRect().top/(el.offsetHeight-innerHeight)));let next=Math.min(mainDishes.length-1,Math.round(p*(mainDishes.length-1)));if(next!==active){active=next;renderHero()}ticking=false})});document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.dish-card').forEach(c=>c.style.display=b.dataset.filter==='All'||c.dataset.category===b.dataset.filter?'block':'none')});bindAdds();
</script></body></html>
