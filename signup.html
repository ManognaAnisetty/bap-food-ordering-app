<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Join BAP</title><link rel="stylesheet" href="assets/styles.css"></head><body><main id="app"></main><script src="assets/app.js"></script><script>
mount(`<section class="auth"><div class="auth-form"><form class="form-box" id="signupForm"><span class="eyebrow">Your next favourite meal</span><h1>Join the table.</h1><p class="muted">A more thoughtful way to discover food starts here.</p><label>Your name</label><input id="name" placeholder="How should we call you?" required><label>Email address</label><input id="email" type="email" placeholder="you@example.com" required><label>Create password</label><input type="password" placeholder="At least 8 characters" required><button class="btn btn-red">Create my account →</button><p class="muted" style="text-align:center;font-size:.85rem">Already with us? <a href="login.html" style="color:var(--red);font-weight:700">Sign in</a></p></form></div><div class="auth-visual"><span class="eyebrow" style="color:#ffccd4">Made for cravings</span><h1>Every great meal starts with a little curiosity.</h1><p>Explore independent kitchens, save your favourites, and make ordinary evenings better.</p></div></section>`,'auth');document.getElementById('signupForm').addEventListener('submit',e=>{e.preventDefault();setUser({name:document.getElementById('name').value.trim(),email:document.getElementById('email').value.trim().toLowerCase()});location.href='restaurant.html'});
</script></body></html>
