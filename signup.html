<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Join BAP</title><link rel="stylesheet" href="assets/styles.css"></head><body><main id="app"></main><script src="assets/app.js"></script><script>
mount(`<section class="auth"><div class="auth-form"><form class="form-box" id="signupForm"><span class="eyebrow">Your next favourite meal</span><h1>Join the table.</h1><p class="muted">Create an account once. Everything you save will still be here when you sign in again.</p><label>Your name</label><input id="name" autocomplete="name" required><label>Phone number</label><input id="phone" type="tel" autocomplete="tel" required><label>Email address</label><input id="email" type="email" autocomplete="email" required><label>Create password</label><input id="password" type="password" minlength="8" autocomplete="new-password" required><p id="formMessage" class="form-message" role="alert"></p><button class="btn btn-red">Create my account →</button><p class="muted" style="text-align:center;font-size:.85rem">Already with us? <a href="login.html" style="color:var(--red);font-weight:700">Sign in</a></p></form></div><div class="auth-visual"><span class="eyebrow" style="color:#ffccd4">Made for cravings</span><h1>Every great meal starts with a little curiosity.</h1><p>Explore independent kitchens, save your favourites, and choose where each order should arrive.</p></div></section>`,'auth');document.getElementById('signupForm').addEventListener('submit',e=>{e.preventDefault();let old=findUser(email.value);if(old){document.getElementById('formMessage').innerHTML='An account already exists for this email. <a href="login.html">Sign in instead.</a>';return}setUser({name:name.value.trim(),phone:phone.value.trim(),email:email.value,password:password.value});location.href='restaurant.html'});
</script></body></html>
