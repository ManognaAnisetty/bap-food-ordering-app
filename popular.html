<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Popular items — BAP</title><link rel="stylesheet" href="assets/styles.css"></head><body><main id="app"></main><script src="assets/app.js"></script><script>
mount(`<section class="full-menu"><div class="container"><div class="section-head"><div><span class="eyebrow">Most loved nearby</span><h1>Popular <i>items.</i></h1></div><p class="muted">The best dishes from your favourite neighbourhood kitchens, all in one place.</p></div><div class="filters"><button class="filter active" data-filter="All">All items</button>${['North Indian','Italian','Asian','Sweet treats'].map(x=>`<button class="filter" data-filter="${x}">${x}</button>`).join('')}</div><div class="dish-grid">${dishes.map(menuCard).join('')}</div></div></section>`,'popular');document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.dish-card').forEach(c=>c.style.display=b.dataset.filter==='All'||c.dataset.category===b.dataset.filter?'block':'none')});bindAdds();
</script></body></html>
