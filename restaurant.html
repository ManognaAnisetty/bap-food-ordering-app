<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>BAP — Discover food</title><link rel="stylesheet" href="assets/styles.css"></head><body><main id="app"></main><script src="assets/app.js"></script><script>
const restaurants=[{n:'Saffron Table',d:'North Indian · Mughlai',r:'4.8',t:'28–35 min',i:'https://images.unsplash.com/photo-1585937421612-70a008356fbe?auto=format&fit=crop&w=900&q=85'},{n:'Olive & Hearth',d:'Italian · European',r:'4.6',t:'30–38 min',i:'https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=900&q=85'},{n:'Nori House',d:'Japanese · Asian',r:'4.7',t:'25–32 min',i:'https://images.unsplash.com/photo-1579871494447-9811cf80d66c?auto=format&fit=crop&w=900&q=85'},{n:'Dosa District',d:'South Indian · Breakfast',r:'4.7',t:'20–28 min',i:'https://images.unsplash.com/photo-1630409346824-4f0e7b080087?auto=format&fit=crop&w=900&q=85'},{n:'Punjab Grill',d:'North Indian · Kebabs',r:'4.5',t:'30–38 min',i:'https://images.unsplash.com/photo-1565557623262-b51c2513a641?auto=format&fit=crop&w=900&q=85'},{n:'The Pizza Project',d:'Pizza · Italian',r:'4.6',t:'25–35 min',i:'https://images.unsplash.com/photo-1513104890138-7c749659a591?auto=format&fit=crop&w=900&q=85'},{n:'Wok & Bowl',d:'Chinese · Asian',r:'4.5',t:'24–32 min',i:'https://images.unsplash.com/photo-1512058564366-18510be2db19?auto=format&fit=crop&w=900&q=85'},{n:'Green Leaf Kitchen',d:'Healthy · Salads',r:'4.8',t:'22–30 min',i:'https://images.unsplash.com/photo-1512621776951-a57141f2eefd?auto=format&fit=crop&w=900&q=85'},{n:'Burger Barn',d:'Burgers · Fast food',r:'4.4',t:'20–27 min',i:'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=900&q=85'},{n:'Sugar Cloud',d:'Desserts · Bakery',r:'4.7',t:'24–30 min',i:'https://images.unsplash.com/photo-1551024506-0bccd828d307?auto=format&fit=crop&w=900&q=85'}];
function restaurantCard(x){return `<a class="restaurant-card" href="menu.html"><img src="${x.i}" alt="${x.d} food from ${x.n}"><div class="content"><h3>${x.n}</h3><div class="meta"><span class="rating">${x.r}/5 rating</span><span>${x.t}</span></div><p class="muted" style="margin:8px 0 0;font-size:.8rem">${x.d}</p></div></a>`}function showRestaurants(list){document.getElementById('restaurantGrid').innerHTML=list.length?list.map(restaurantCard).join(''):`<p class="muted" style="grid-column:1/-1;padding:25px 0">No restaurants found. Try a cuisine or restaurant name.</p>`}
mount(`<section class="hero-home"><div class="container home-grid"><div class="hero-copy"><span class="eyebrow">Every meal has a mood</span><h1>Good food,<br><i>beautifully found.</i></h1><p class="muted">Discover neighbourhood kitchens and memorable dishes, selected for every craving and delivered right to your door.</p><div class="hero-search"><input id="restaurantSearch" placeholder="Search restaurants or cuisines" aria-label="Search restaurants"><button id="searchButton" class="btn btn-red" type="button">Find food →</button></div><div class="meta"><span>300+ handpicked restaurants</span><span>30 min average delivery</span></div></div><div class="photo-stack"><img src="https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=900&q=85" alt="Fresh food spread"><img src="https://images.unsplash.com/photo-1515003197210-e0cd71810b5f?auto=format&fit=crop&w=700&q=85" alt="Spiced dish"><div class="float-card">4.9 <b>Neighbourhood favourite</b></div></div></div></section><section class="section" id="restaurants" style="background:#fff"><div class="container"><div class="section-head"><div><span class="eyebrow">Around you</span><h2>Popular restaurants</h2></div><a class="btn btn-outline" href="popular.html">Browse popular items →</a></div><div class="restaurants" id="restaurantGrid"></div></div></section>`,'home');showRestaurants(restaurants);function runSearch(){let query=restaurantSearch.value.trim().toLowerCase();showRestaurants(restaurants.filter(x=>`${x.n} ${x.d}`.toLowerCase().includes(query)));if(query)document.getElementById('restaurants').scrollIntoView({behavior:'smooth'})}searchButton.onclick=runSearch;restaurantSearch.addEventListener('input',runSearch);restaurantSearch.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();runSearch()}});
</script></body></html>
