<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>BAP — Discover food</title><link rel="stylesheet" href="assets/styles.css"></head><body><main id="app"></main><script src="assets/app.js"></script><script>
const categoryImages={"North Indian":"https://images.unsplash.com/photo-1565557623262-b51c2513a641?auto=format&fit=crop&w=700&q=85",Italian:"https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?auto=format&fit=crop&w=700&q=85",Asian:"https://images.unsplash.com/photo-1617196034796-73dfa7b1fd56?auto=format&fit=crop&w=700&q=85","Sweet treats":"https://images.unsplash.com/photo-1551024506-0bccd828d307?auto=format&fit=crop&w=700&q=85"};
const restaurants=[{n:'Saffron Table',d:'North Indian · Mughlai',r:'4.8',t:'28–35 min',i:'https://images.unsplash.com/photo-1585937421612-70a008356fbe?auto=format&fit=crop&w=900&q=85'},{n:'Olive & Hearth',d:'Italian · European',r:'4.6',t:'30–38 min',i:'https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=900&q=85'},{n:'Nori House',d:'Japanese · Asian',r:'4.7',t:'25–32 min',i:'https://images.unsplash.com/photo-1579871494447-9811cf80d66c?auto=format&fit=crop&w=900&q=85'}];
function restaurantCard(x){return `<a class="restaurant-card" href="menu.html"><img src="${x.i}" alt="${x.n} restaurant"><div class="content"><h3>${x.n}</h3><div class="meta"><span class="rating">${x.r}/5 rating</span><span>${x.t}</span></div><p class="muted" style="margin:8px 0 0;font-size:.8rem">${x.d}</p></div></a>`}
mount(`<div class="filter-overlay" id="filterOverlay" aria-hidden="true"><section class="filter-dialog" role="dialog" aria-modal="true" aria-labelledby="filterTitle"><button class="close-filter" id="closeFilters" aria-label="Close filters">×</button><span class="eyebrow">Refine your search</span><h2 id="filterTitle">Filters</h2><h3>Price per item</h3><label><input type="checkbox" name="price" value="0-199"> Under ₹200</label><label><input type="checkbox" name="price" value="200-349"> ₹200 – ₹349</label><label><input type="checkbox" name="price" value="350-999"> ₹350 and above</label><h3>Dietary preference</h3><label><input type="checkbox" name="diet" value="Veg"> Veg</label><label><input type="checkbox" name="diet" value="Non-veg"> Non-veg</label><div class="filter-actions"><button class="btn btn-outline" id="clearFilters">Clear all</button><button class="btn btn-red" id="applyFilters">Show items</button></div></section></div><section class="hero-home"><div class="container home-grid"><div class="hero-copy"><span class="eyebrow">Every meal has a mood</span><h1>Good food,<br><i>beautifully found.</i></h1><p class="muted">Discover neighbourhood kitchens and memorable dishes, selected for every craving and delivered right to your door.</p><div class="hero-search"><input placeholder="What are you craving today?"><a class="btn btn-red" href="#popular-items">Find food →</a></div><div class="meta"><span>300+ handpicked restaurants</span><span>30 min average delivery</span></div></div><div class="photo-stack"><img src="https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=900&q=85" alt="Fresh food spread"><img src="https://images.unsplash.com/photo-1515003197210-e0cd71810b5f?auto=format&fit=crop&w=700&q=85" alt="Spiced dish"><div class="float-card">4.9 <b>Neighbourhood favourite</b></div></div></div></section><section class="section"><div class="container"><div class="section-head"><div><span class="eyebrow">Browse your way</span><h2>What are you in the mood for?</h2></div><p class="muted">Choose a cuisine to see matching dishes from several restaurants.</p></div><div class="categories">${Object.entries(categoryImages).map(([name,img])=>`<button class="category category-button" data-category="${name}"><img src="${img}" alt="${name} cuisine"><span>${name}</span></button>`).join('')}</div></div></section><section class="full-menu" id="popular-items"><div class="container"><div class="section-head"><div><span class="eyebrow">Most loved nearby</span><h2 id="itemsHeading">Popular items</h2></div><p class="muted">Browse dishes from multiple restaurants in the same menu-card layout, then add them straight to your cart.</p></div><div class="filters" id="cuisineFilters"><button class="filter active" data-filter="All">All items</button>${Object.keys(categoryImages).map(x=>`<button class="filter" data-filter="${x}">${x}</button>`).join('')}</div><div class="dish-grid" id="popularGrid">${dishes.map(menuCard).join('')}</div></div></section><section class="section" id="popular-restaurants" style="background:#fff"><div class="container"><div class="section-head"><div><span class="eyebrow">Around you</span><h2>Popular restaurants</h2></div><a class="btn btn-outline" href="menu.html">Explore restaurant menu →</a></div><div class="restaurants">${restaurants.map(restaurantCard).join('')}</div></div></section><section class="section" id="profile"><div class="container"><span class="eyebrow">Your account</span><h2>Hello, ${getUser()?.name||'food lover'}.</h2><p class="muted">Your cart and order history are always one tap away.</p></div></section>`,'home');
function showCuisine(category){document.querySelectorAll('#cuisineFilters .filter').forEach(b=>b.classList.toggle('active',b.dataset.filter===category));document.querySelectorAll('#popularGrid .dish-card').forEach(c=>c.style.display=category==='All'||c.dataset.category===category?'block':'none');document.getElementById('itemsHeading').textContent=category==='All'?'Popular items':`${category} favourites`;document.getElementById('popular-items').scrollIntoView({behavior:'smooth'});}
document.querySelectorAll('.category-button').forEach(b=>b.onclick=()=>showCuisine(b.dataset.category));document.querySelectorAll('#cuisineFilters .filter').forEach(b=>b.onclick=()=>showCuisine(b.dataset.filter));const overlay=document.getElementById('filterOverlay');function closeFilters(){overlay.classList.remove('visible');overlay.setAttribute('aria-hidden','true')}document.getElementById('openFilters')?.addEventListener('click',()=>{overlay.classList.add('visible');overlay.setAttribute('aria-hidden','false')});document.getElementById('closeFilters').onclick=closeFilters;overlay.addEventListener('click',e=>{if(e.target===overlay)closeFilters()});document.getElementById('clearFilters').onclick=()=>overlay.querySelectorAll('input').forEach(i=>i.checked=false);document.getElementById('applyFilters').onclick=()=>{const prices=[...overlay.querySelectorAll('input[name=price]:checked')].map(i=>i.value.split('-').map(Number));const diets=[...overlay.querySelectorAll('input[name=diet]:checked')].map(i=>i.value);document.querySelectorAll('#popularGrid .dish-card').forEach(card=>{let price=Number(card.dataset.price),diet=card.dataset.diet;card.style.display=(!prices.length||prices.some(([min,max])=>price>=min&&price<=max))&&(!diets.length||diets.includes(diet))?'block':'none'});document.querySelectorAll('#cuisineFilters .filter').forEach(b=>b.classList.toggle('active',b.dataset.filter==='All'));document.getElementById('itemsHeading').textContent='Filtered popular items';closeFilters();document.getElementById('popular-items').scrollIntoView({behavior:'smooth'})};bindAdds();
</script></body></html>
